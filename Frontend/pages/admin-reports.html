<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reports - Book Me Events</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="../css/styles.css" />
    <link rel="stylesheet" href="../css/landing-professional.css" />
  </head>
  <body>
    <main class="section">
      <div class="container" style="max-width: 1000px">
        <div class="d-flex flex-wrap align-items-center justify-content-between gap-3 mb-4">
          <div>
            <div class="badge badge-glow mb-2">Moderation</div>
            <h1 class="h3 fw-bold mb-0">Participant reports</h1>
          </div>
          <a class="btn btn-soft" href="admin-dashboard.html">Admin dashboard</a>
        </div>
        <div id="reportError" class="alert alert-danger d-none" role="alert"></div>
        <div id="reportList" class="d-grid gap-3" aria-live="polite"></div>
        <section id="reportEmpty" class="card card-glass p-4 d-none" aria-live="polite">
          <h2 class="h5 fw-bold">No reports to review</h2>
          <p class="text-muted-soft mb-0">New participant reports will appear here.</p>
        </section>
      </div>
    </main>
    <script type="module">
      import { apiFetch, fetchMe, clearToken } from '../js/api.js';

      const list = document.getElementById('reportList');
      const empty = document.getElementById('reportEmpty');
      const error = document.getElementById('reportError');

      async function load() {
        error.classList.add('d-none');
        try {
          const response = await apiFetch('/api/v1/admin/reports?limit=50');
          const reports = Array.isArray(response?.data) ? response.data : [];
          list.replaceChildren();
          empty.classList.toggle('d-none', reports.length > 0);
          for (const report of reports) {
            const card = document.createElement('article');
            card.className = 'card card-glass p-3';
            const heading = document.createElement('h2');
            heading.className = 'h6 fw-bold';
            const reporter = report.reporter || {};
            const reported = report.reportedUser || {};
            heading.textContent = `${report.reportedRole || reported.role || 'ACCOUNT'} report · ${report.status}`;
            const meta = document.createElement('div');
            meta.className = 'small text-muted-soft mb-2';
            meta.textContent = `From ${[reporter.firstName, reporter.lastName].filter(Boolean).join(' ') || reporter.email || 'Unknown'} · About ${[reported.firstName, reported.lastName].filter(Boolean).join(' ') || reported.email || 'Unknown'} · ${report.createdAt ? new Date(report.createdAt).toLocaleString() : ''}`;
            const reason = document.createElement('p');
            reason.className = 'mb-3';
            reason.textContent = report.reason || '';
            const controls = document.createElement('div');
            controls.className = 'd-flex flex-wrap gap-2 align-items-start';
            const status = document.createElement('select');
            status.className = 'form-select';
            status.style.maxWidth = '220px';
            for (const [value, label] of [['IN_REVIEW', 'In review'], ['RESOLVED', 'Resolved'], ['DISMISSED', 'Dismissed']]) {
              const option = document.createElement('option');
              option.value = value;
              option.textContent = label;
              status.append(option);
            }
            const notes = document.createElement('input');
            notes.className = 'form-control';
            notes.maxLength = 2000;
            notes.placeholder = 'Optional note to attach';
            notes.value = report.adminNotes || '';
            notes.style.maxWidth = '320px';
            const update = document.createElement('button');
            update.type = 'button';
            update.className = 'btn btn-brand';
            update.textContent = 'Update report';
            update.addEventListener('click', async () => {
              update.disabled = true;
              try {
                await apiFetch(`/api/v1/admin/reports/${encodeURIComponent(report._id)}`, {
                  method: 'PUT',
                  body: { status: status.value, adminNotes: notes.value },
                });
                await load();
              } catch (e) {
                error.textContent = e?.message || 'Could not update this report.';
                error.classList.remove('d-none');
                update.disabled = false;
              }
            });
            controls.append(status, notes, update);
            card.append(heading, meta, reason, controls);
            list.append(card);
          }
        } catch (e) {
          if (e?.status === 401 || e?.status === 403) {
            clearToken();
            window.location.replace('auth-login.html');
            return;
          }
          error.textContent = e?.message || 'Could not load reports.';
          error.classList.remove('d-none');
        }
      }

      try {
        const response = await fetchMe();
        const user = response?.data || response;
        if ((user?.role || '').toUpperCase() !== 'ADMIN') throw new Error('Admin access is required.');
        await load();
      } catch {
        clearToken();
        window.location.replace('auth-login.html');
      }
    </script>
  </body>
</html>
