<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vendor support - Book Me Events</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="../css/styles.css" />
    <link rel="stylesheet" href="../css/landing-professional.css" />
  </head>
  <body>
    <div class="container py-4" style="max-width: 960px">
      <div class="d-flex align-items-center justify-content-between gap-3 mb-4">
        <div>
          <div class="badge badge-glow mb-2">Vendor workspace</div>
          <h1 class="h3 fw-bold mb-0">Support</h1>
        </div>
        <a class="btn btn-soft" href="vendor-dashboard.html">Dashboard</a>
      </div>
      <div id="supportError" class="alert alert-danger d-none" role="alert"></div>
      <div id="ticketList" class="d-grid gap-3" aria-live="polite"></div>
      <section id="ticketEmpty" class="card card-glass p-4 d-none" aria-live="polite">
        <h2 class="h5 fw-bold">No customer tickets yet</h2>
        <p class="text-muted-soft mb-0">Tickets linked to your service requests or bookings will appear here.</p>
      </section>
    </div>
    <script type="module">
      import { apiFetch, fetchMe, clearToken } from '../js/api.js';

      const list = document.getElementById('ticketList');
      const empty = document.getElementById('ticketEmpty');
      const error = document.getElementById('supportError');

      async function load() {
        try {
          await fetchMe();
          const response = await apiFetch('/api/v1/vendors/tickets?limit=50');
          const tickets = Array.isArray(response?.data) ? response.data : [];
          list.replaceChildren();
          empty.classList.toggle('d-none', tickets.length > 0);
          for (const ticket of tickets) {
            const card = document.createElement('article');
            card.className = 'card card-glass p-3';
            const heading = document.createElement('h2');
            heading.className = 'h6 fw-bold';
            heading.textContent = ticket.subject || 'Support ticket';
            const details = document.createElement('p');
            details.className = 'mb-2';
            details.textContent = ticket.description || '';
            const meta = document.createElement('div');
            meta.className = 'small text-muted-soft';
            const createdAt = ticket.createdAt ? new Date(ticket.createdAt).toLocaleString() : '';
            meta.textContent = [ticket.status, ticket.priority, createdAt].filter(Boolean).join(' · ');
            card.append(heading, details, meta);
            list.append(card);
          }
        } catch (e) {
          if (e?.status === 401 || e?.status === 403) {
            clearToken();
            window.location.replace('auth-login.html');
            return;
          }
          error.textContent = e?.message || 'Could not load support tickets.';
          error.classList.remove('d-none');
        }
      }

      load();
    </script>
  </body>
</html>
